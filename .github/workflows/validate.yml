name: Validate templates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python syntax
        run: python3 -m py_compile validator/validate.py tests/test_validator.py
      - name: Static validator
        run: python3 validator/validate.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Whitespace errors
        run: git diff --check "$(git merge-base HEAD origin/main)..HEAD"
