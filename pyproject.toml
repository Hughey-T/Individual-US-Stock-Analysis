[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "individual-stock-analysis-runtime"
version = "2.0.0"
description = "Validation and persistence runtime for independent stock-analysis artifacts"
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "build>=1"]
[project.scripts]
stock-analysis-runtime = "stock_analysis_runtime.api:main"
[tool.setuptools.packages.find]
include = ["stock_analysis_runtime*"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
strict = true
